name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # GitHub-hosted runners include Docker, which Testcontainers needs.
      # Testcontainers 1.21.x asks Docker for an old API version that the newest Docker Engine
      # on GitHub runners rejects. Pin a newer one for the Docker client library.
      - name: Configure Docker API version for Testcontainers
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Build and test
        run: mvn -B -ntp verify
