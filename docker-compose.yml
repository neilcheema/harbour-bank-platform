# Local infrastructure. Dev-only credentials; never reuse them anywhere real.
# Kafka, Keycloak, Prometheus and Grafana are added in later weeks.
services:
  postgres:
    image: postgres:16-alpine
    container_name: harbour-postgres
    environment:
      POSTGRES_DB: harbour
      POSTGRES_USER: harbour
      POSTGRES_PASSWORD: harbour_dev_only
    ports:
      - "5432:5432"
    volumes:
      - harbour-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbour -d harbour"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  harbour-pgdata:
