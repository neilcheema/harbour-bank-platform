spring:
  application:
    name: harbour-bank-platform
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-009). "validate" makes Hibernate check at startup that every
      # mapped entity matches a real table and column, and refuse to start if they drift apart.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
