spring:
  application:
    name: harbour-bank-platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by Flyway (ADR-009)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
